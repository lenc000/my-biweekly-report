<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙週誌 AI 處理器</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 100%; max-width: 800px; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; box-sizing: border-box; font-size: 16px; }
        input[type="file"] { margin-bottom: 10px; }
        
        /* 預覽區塊樣式：大約 3x3 公分 (90x90px) */
        #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-box { width: 90px; height: 90px; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn { position: absolute; top: 4px; right: 4px; background: rgba(255, 0, 0, 0.8); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; line-height: 1; }
        .delete-btn:hover { background: red; }

        button#submitBtn { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button#submitBtn:hover { background: #2563eb; }
        button#submitBtn:disabled { background: #9ca3af; cursor: not-allowed; }
        #result-container { margin-top: 25px; }
        .result-box { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; white-space: pre-wrap; line-height: 1.6; font-size: 16px; min-height: 100px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>雙週誌 AI 處理器</h1>
    
    <div class="form-group">
        <label>1. 貼上你的語音文字稿：</label>
        <textarea id="textInput" placeholder="請在此貼上這兩週的學習紀錄..."></textarea>
    </div>

    <div class="form-group">
        <label>2. 上傳相關照片 (可隨時點擊右上角 ✖ 刪除錯誤照片)：</label>
        <input type="file" id="imageInput" multiple accept="image/*">
        <!-- 縮圖預覽區 -->
        <div id="preview-container"></div>
    </div>

    <button id="submitBtn">🚀 產出雙週誌</button>

    <div id="result-container">
        <label>產出結果 (請直接複製貼上至繳交網站)：</label>
        <div id="result" class="result-box">尚未產出...</div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('preview-container');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('result');
    
    // 用陣列存放選擇的照片檔案
    let selectedFiles = [];

    // 當選擇檔案時觸發
    imageInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        // 合併新選擇的檔案到陣列中
        selectedFiles = selectedFiles.concat(files);
        // 清空 input 讓它能重複選擇相同的檔案
        imageInput.value = '';
        renderPreviews();
    });

    // 渲染預覽畫面
    function renderPreviews() {
        previewContainer.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const box = document.createElement('div');
                box.className = 'preview-box';
                
                const img = document.createElement('img');
                img.src = e.target.result;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✖';
                deleteBtn.onclick = () => {
                    // 從陣列中移除該檔案並重新渲染
                    selectedFiles.splice(index, 1);
                    renderPreviews();
                };

                box.appendChild(img);
                box.appendChild(deleteBtn);
                previewContainer.appendChild(box);
            };
            reader.readAsDataURL(file);
        });
    }

    // 處理 Base64 轉換
    const getBase64 = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    };

    // 送出資料
    submitBtn.addEventListener('click', async () => {
        const text = document.getElementById('textInput').value;
        if (!text && selectedFiles.length === 0) {
            alert('請至少輸入文字或上傳一張照片！');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = '處理中，請稍候... (若有圖片會比較久)';
        resultBox.innerText = 'AI 正在努力撰寫中...';

        try {
            // 將所有選擇的檔案轉為 Base64
            const base64Images = await Promise.all(selectedFiles.map(file => getBase64(file)));

            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, images: base64Images })
            });

            const data = await response.json();

            if (response.ok) {
                resultBox.innerText = data.result;
            } else {
                resultBox.innerText = `發生錯誤: ${data.error}`;
            }
        } catch (error) {
            resultBox.innerText = `連線失敗: ${error.message}`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '🚀 產出雙週誌';
        }
    });
</script>

</body>
</html>
