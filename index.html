<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00後翻譯機</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif; 
            background: linear-gradient(135deg, #8ba89f 0%, #7e99b0 100%); 
            min-height: 100vh; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 800px; 
        }
        
        h1 { 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #6c8aa3 0%, #4b6a85 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #444; font-size: 15px; }
        
        textarea, input[type="text"] { 
            width: 100%; 
            padding: 15px; 
            border: 1.5px solid #d1d5db; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea { height: 160px; resize: vertical; line-height: 1.6; }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #8ba89f;
            box-shadow: 0 0 0 3px rgba(139, 168, 159, 0.2);
        }
        
        input[type="file"] { margin-bottom: 10px; font-family: inherit; }
        input[type="file"]::file-selector-button {
            background-color: #8ba89f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            margin-right: 15px;
            font-size: 14px;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #759289;
        }
        
        #preview-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
        .preview-box { 
            width: 90px; 
            height: 90px; 
            position: relative; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.1); 
            border: 1px solid #e5e7eb; 
            background: #fff;
        }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .delete-btn { 
            position: absolute; 
            top: 4px; 
            right: 4px; 
            background: rgba(100, 100, 100, 0.85); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            font-size: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            opacity: 0; 
            transition: opacity 0.2s ease, background 0.2s;
        }
        .preview-box:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: rgba(70, 70, 70, 0.95); }

        button#submitBtn { 
            width: 100%; 
            padding: 16px; 
            background: #7e99b0; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.3s, transform 0.1s; 
            letter-spacing: 1px;
        }
        button#submitBtn:hover { background: #6c8aa3; }
        button#submitBtn:active { transform: translateY(2px); }
        button#submitBtn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
        
        #result-container { margin-top: 30px; }
        .result-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .result-header-row label { margin-bottom: 0; }
        
        button#copyBtn {
            background: #8ba89f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            display: none; 
        }
        button#copyBtn:hover { background: #759289; }

        .result-box { 
            background: #f8fafc; 
            padding: 25px; 
            border-radius: 10px; 
            border: 1.5px solid #d1d5db; 
            line-height: 1.7; 
            font-size: 16px; 
            min-height: 120px; 
            color: #334155; 
            box-sizing: border-box;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 5px;
        }
        
        .section-header:first-child {
            margin-top: 0;
        }

        .highlight-title {
            font-weight: 900;
            color: #4b6a85;
            background: rgba(126, 153, 176, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .section-copy-btn {
            background: #cbd5e1;
            color: #334155;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .section-copy-btn:hover { background: #94a3b8; color: white; }
        
        .section-content {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>00後翻譯機</h1>
    
    <div class="form-group">
        <label>1. 貼上你的語音文字稿：</label>
        <textarea id="textInput" placeholder="請在此貼上紀錄內容..."></textarea>
    </div>

    <div class="form-group">
        <label>2. 自訂本次風格微調 (選填)：</label>
        <input type="text" id="styleInput" placeholder="例如：客觀敘述、強化亮點與反思、增加個人獨特視角...">
    </div>

    <div class="form-group">
        <label>3. 上傳相關照片 (最多 10 張)：</label>
        <input type="file" id="imageInput" multiple accept="image/*">
        <div id="preview-container"></div>
    </div>

    <button id="submitBtn">產出結果</button>

    <div id="result-container">
        <div class="result-header-row">
            <label>產出結果：</label>
            <button id="copyBtn">📋 全部複製</button>
        </div>
        <div id="result" class="result-box">尚未產出...</div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('preview-container');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');
    
    let selectedFiles = [];
    let fullRawText = ""; 

    imageInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        
        // 檢查：如果加上這次選的照片超過 10 張，就阻擋並跳出警告
        if (selectedFiles.length + files.length > 10) {
            alert(`超過上傳限制！目前已選 ${selectedFiles.length} 張，最多只能上傳 10 張照片。請重新選擇。`);
            imageInput.value = ''; // 清空這次的選擇
            return;
        }

        selectedFiles = selectedFiles.concat(files);
        imageInput.value = '';
        renderPreviews();
    });

    function renderPreviews() {
        previewContainer.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const box = document.createElement('div');
                box.className = 'preview-box';
                
                const img = document.createElement('img');
                img.src = e.target.result;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✖';
                deleteBtn.onclick = () => {
                    selectedFiles.splice(index, 1);
                    renderPreviews();
                };

                box.appendChild(img);
                box.appendChild(deleteBtn);
                previewContainer.appendChild(box);
            };
            reader.readAsDataURL(file);
        });
    }

    // 圖片壓縮功能 (控制在最大寬度 800px，畫質 70%)
    const compressImage = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(compressedBase64);
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    };

    submitBtn.addEventListener('click', async () => {
        const text = document.getElementById('textInput').value;
        const styleAdjustment = document.getElementById('styleInput').value;

        if (!text && selectedFiles.length === 0) {
            alert('請至少輸入文字或上傳一張照片！');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = '處理中，請稍候...';
        resultBox.innerText = 'AI 正在分析與撰寫中...';
        copyBtn.style.display = 'none';

        try {
            const base64Images = await Promise.all(selectedFiles.map(file => compressImage(file)));

            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, styleAdjustment: styleAdjustment, images: base64Images })
            });

            if (!response.ok) {
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '伺服器發生錯誤');
                } else {
                    const errorText = await response.text();
                    if (errorText.includes('FUNCTION_PAYLOAD_TOO_LARGE')) {
                        throw new Error('照片總檔案依然太大，請減少上傳的圖片數量。');
                    }
                    throw new Error('伺服器無效回應，請稍後再試。');
                }
            }

            const data = await response.json();

            if (data.result) {
                fullRawText = data.result;
                
                const sections = fullRawText.split(/(?=【.*?】)/).filter(s => s.trim() !== '');
                let htmlContent = '';
                
                sections.forEach(section => {
                    const match = section.match(/^(【.*?】)\s*([\s\S]*)$/);
                    if (match) {
                        const title = match[1];
                        const content = match[2].trim();
                        htmlContent += `
                            <div>
                                <div class="section-header">
                                    <span class="highlight-title">${title}</span>
                                    <button class="section-copy-btn" data-content="${encodeURIComponent(content)}">複製這段</button>
                                </div>
                                <div class="section-content">${content.replace(/\n/g, '<br>')}</div>
                            </div>
                        `;
                    } else {
                        htmlContent += `<div class="section-content">${section.replace(/\n/g, '<br>')}</div>`;
                    }
                });

                resultBox.innerHTML = htmlContent;
                copyBtn.style.display = 'inline-block';
                
                document.querySelectorAll('.section-copy-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const contentToCopy = decodeURIComponent(this.getAttribute('data-content'));
                        navigator.clipboard.writeText(contentToCopy).then(() => {
                            const originalText = this.innerText;
                            this.innerText = '✅ 已複製';
                            this.style.background = '#8ba89f';
                            this.style.color = 'white';
                            setTimeout(() => {
                                this.innerText = originalText;
                                this.style.background = '#cbd5e1';
                                this.style.color = '#334155';
                            }, 2000);
                        }).catch(err => alert('複製失敗'));
                    });
                });
            } else {
                resultBox.innerText = `發生錯誤: 未知錯誤`;
            }
        } catch (error) {
            resultBox.innerText = `連線失敗: ${error.message}`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '產出結果';
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(fullRawText).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '✅ 全部已複製！';
            copyBtn.style.background = '#7e99b0';
            
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.style.background = '#8ba89f';
            }, 2000);
        }).catch(err => {
            alert('複製失敗，請手動反白複製。');
        });
    });
</script>

</body>
</html>
